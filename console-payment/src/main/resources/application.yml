server:
  port: ${PAYMENT_SERVER_PORT:6083}

spring:
  application:
    name: console-payment
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:mysql://127.0.0.1:3306/console?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf-8&useSSL=false}
    username: ${PAYMENT_DB_USERNAME:root}
    password: ${PAYMENT_DB_PASSWORD:}
  data:
    redis:
      host: ${PAYMENT_REDIS_HOST:127.0.0.1}
      port: ${PAYMENT_REDIS_PORT:6379}
      password: ${PAYMENT_REDIS_PASSWORD:}
      database: ${PAYMENT_REDIS_DATABASE:1}

database:
  prefix: ${PAYMENT_DB_PREFIX:console}

console:
  fileUpload:
    baseFilePath: ${PAYMENT_FILE_UPLOAD_PATH:/tmp/console-payment/}
